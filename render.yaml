# Render Blueprint. In the Render dashboard: New -> Blueprint, point it at this
# repository, and it reads this file instead of you filling in a form.
#
# DATABASE_URL is deliberately left blank (sync: false) so you paste your own
# Postgres connection string. Render's own free Postgres is deleted after 30
# days; Neon's free tier is not, which is why the guide points there.
services:
  - type: web
    name: bd-dispatch
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Signs the sign-in tokens. Generated once and then left alone —
      # changing it signs everybody out.
      - key: JWT_SECRET
        generateValue: true

      # Your Postgres connection string. postgres:// is normalised in the app.
      - key: DATABASE_URL
        sync: false

      # Used once, on an empty database, to create the manager account.
      # Sign in, change the password, then clear these two.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Manager

      # The browser app is served by this same service, so there is no other
      # origin to allow.
      - key: CORS_ORIGINS
        value: ""
